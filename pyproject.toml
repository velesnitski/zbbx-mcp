[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zbbx-mcp"
version = "1.16.72"
description = "Zabbix MCP server for Claude Code, GitHub Copilot, Codex CLI, n8n, and any MCP-compatible client"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Alex Velesnitski" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]
keywords = ["zabbix", "mcp", "monitoring", "claude", "copilot", "codex"]
dependencies = [
    "mcp>=1.28.1,<2.0.0",
    "anyio>=4.14.2",  # GHSA advisory floor, ADR 145
    "pyjwt>=2.15.1",  # advisory floor, ADR 149
    "urllib3>=2.8.0",  # advisory floor, ADR 149
    "httpx[http2]>=0.27.0",
    "openpyxl>=3.1.0",
    "sentry-sdk>=2.0",
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3,<10", "pytest-asyncio>=1,<2", "pytest-cov>=7,<8", "pygments>=2.20.0",
    "hypothesis>=6.100,<7",  # property tests (tests/test_properties.py)
    "mutmut>=3.8,<4",  # source_paths/only_mutate config; scripts/mutation.sh
]
# Pinned to match .github/workflows/test.yml exactly — a floating local
# version lints against different rules than CI (ADR 099).
lint = ["ruff==0.16.0"]
typecheck = ["mypy>=1.10,<3"]

[project.urls]
Homepage = "https://github.com/velesnitski/zbbx-mcp"
Repository = "https://github.com/velesnitski/zbbx-mcp"
Issues = "https://github.com/velesnitski/zbbx-mcp/issues"
Changelog = "https://github.com/velesnitski/zbbx-mcp/blob/main/CHANGELOG.md"

[project.scripts]
zbbx-mcp = "zbbx_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["zbbx_mcp"]
branch = false
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mutmut]
# Mutation testing of the pure core only (scripts/mutation.sh). The whole
# package is copied into mutants/ so it imports; only these files mutate.
source_paths = ["src/"]
only_mutate = [
    "src/zbbx_mcp/reading.py",
    "src/zbbx_mcp/budget.py",
    "src/zbbx_mcp/data.py",
    "src/zbbx_mcp/formatters.py",
    "src/zbbx_mcp/app_map.py",
    "src/zbbx_mcp/classify.py",
]
# Fast behavioural tests that reach the core. Source-scanning guards
# (test_guards, test_fixture_data_guard, the hostname guard) are left out on
# purpose: they read the mutated files as text and would "kill" every mutant
# for the wrong reason.
pytest_add_cli_args_test_selection = [
    "tests/test_properties.py",
    "tests/test_mutation_core.py",
    "tests/test_live_values.py",
    "tests/test_host_detail.py",
    "tests/test_shaping_directions.py",
    "tests/test_utils.py",
    "tests/test_output_budget.py",
    "tests/test_formatters.py",
    "tests/test_app_map.py",
    "tests/test_app_view.py",
    "tests/test_audit_constants.py",
    "tests/test_canonical_folds.py",
    "tests/test_classify_products.py",
    "tests/test_geo_country.py",
    "tests/test_correlation_floods.py",
    "tests/test_test_hosts.py",
    "tests/test_traffic_totals.py",
    "tests/test_traffic_aggregation.py",
    "tests/test_fetch_cov.py",
    "tests/test_provider_override.py",
    "tests/test_datacenter_override.py",
    "tests/test_template_fallback.py",
    "tests/test_coverage_notes.py",
]
pytest_add_cli_args = ["-q", "-p", "no:cacheprovider"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
# Core modules are mypy-clean (data.py, fetch.py, formatters.py, classify.py,
# config.py, client.py, server.py, logging.py, rollback.py, resolver.py,
# utils.py, excel.py). tools/* has accumulated ~180 type smells over time
# (most are `skip: set[str] = frozenset()` and `dict | list` API returns);
# fix iteratively in a follow-up rather than churn every tool in one pass.
exclude = ["src/zbbx_mcp/tools/", "tests/"]
no_strict_optional = false

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM105", "SIM102"]
