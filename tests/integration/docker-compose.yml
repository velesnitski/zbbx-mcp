# Throwaway Zabbix 7.0 LTS stack for the end-to-end integration tests.
#
# Every credential below is the documented public default of the official
# images, used only against these disposable containers (they are created and
# destroyed per CI run and never reachable from outside the runner).
#
#   docker compose -f tests/integration/docker-compose.yml up -d
#
# Image tags are pinned to an exact 7.0 patch release; bump them deliberately.
name: zbbx-it

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 5s
      timeout: 5s
      retries: 30

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0.31
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
      # Pick up items/triggers created by seed.py within seconds, not a minute.
      ZBX_CACHEUPDATEFREQUENCY: "5"
    ports:
      # Trapper port: only used by seed.py's sender-protocol fallback.
      - "127.0.0.1:10051:10051"
    healthcheck:
      test: ["CMD-SHELL", "pgrep zabbix_server >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0.31
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: "10051"
      PHP_TZ: UTC
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || curl -fsS -o /dev/null http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 30
